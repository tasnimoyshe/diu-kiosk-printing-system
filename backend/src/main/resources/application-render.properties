# =========================================================
# RENDER PRODUCTION PROFILE
# Optimized for Render Free 512 MB instance
# =========================================================


# =========================================================
# SERVER
# =========================================================

server.address=0.0.0.0
server.port=${PORT:10000}

# Keep Tomcat thread memory under control.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20


# =========================================================
# SPRING BOOT MEMORY OPTIMIZATION
# =========================================================

# Beans that are not required during boot are initialized
# when first requested.
spring.main.lazy-initialization=true

# JMX is unnecessary for this portfolio deployment.
spring.jmx.enabled=false

# Keep internal task pools small.
spring.task.scheduling.pool.size=1
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=2
spring.task.execution.pool.queue-capacity=50


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connections are created only when needed where possible.
spring.datasource.connection-fetch=lazy

# Render Free only runs one application instance.
# A large connection pool is unnecessary.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Dhaka

# Repository implementations are initialized on first use
# instead of all 22 repository implementations being fully
# initialized during application startup.
spring.data.jpa.repositories.bootstrap-mode=lazy

# For Render production we do not want Hibernate repeatedly
# inspecting/updating the entire schema on every cold start.
#
# During the ONE-TIME Aiven initialization we will provide:
#
# DDL_AUTO=update
#
# Normal Render deployment will use:
#
# DDL_AUTO=none
#
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}


# =========================================================
# SECURITY
# =========================================================

app.security.cookie.secure=${COOKIE_SECURE:true}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}


# =========================================================
# LIBREOFFICE
# =========================================================

app.document-converter.soffice-path=${SOFFICE_PATH:/usr/bin/soffice}

app.document-converter.timeout-seconds=60