spring.application.name=kiosk

spring.datasource.url=jdbc:mysql://localhost:3306/kiosk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Dhaka

app.admin.full-name=${ADMIN_FULL_NAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-minutes=15
app.security.jwt.refresh-token-days=30

app.security.cookie.secure=${COOKIE_SECURE:false}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=105MB
spring.servlet.multipart.file-size-threshold=2MB

app.pricing.default.color-single-sided=10.00
app.pricing.default.black-white-single-sided=2.00
app.pricing.default.color-double-sided=18.00
app.pricing.default.black-white-double-sided=3.50

app.document-converter.soffice-path=${SOFFICE_PATH:C:/Program Files/LibreOffice/program/soffice.exe}
app.document-converter.timeout-seconds=60

app.print-request.expiration-hours=12
app.print-request.file-deletion-delay-hours=24
app.print-request.expiration-scan-ms=60000

app.payment.cash-pin.pepper=${CASH_PIN_PEPPER:${JWT_SECRET}}
app.payment.cash-pin.expiry-minutes=5
app.payment.cash-pin.max-attempts=5
app.payment.cash-pin.block-minutes=10

app.queue.claim-timeout-minutes=30
app.queue.claim-expiration-scan-ms=60000
app.print-request.file-cleanup-scan-ms=60000